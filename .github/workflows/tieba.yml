name: Daily Tieba Sign-In

on:
  workflow_dispatch:
  schedule:
    - cron: '0 19 * * *'  # UTC 19:00 = 北京时间次日 03:00

jobs:
  signin:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run sign-in
        env:
          BDUSS: ${{ secrets.BDUSS }}
          BARK_KEY_SELF: ${{ secrets.BARK_KEY_SELF }}
          BARK_KEY_OFFICIAL: ${{ secrets.BARK_KEY_OFFICIAL }}
          # 首选自建域名；若被 Cloudflare 安全级别质询（境外 runner 常见）自动回退 workers.dev
          BARK_HOST_SELF: https://bark.nosr.top,https://nosr-bark.nosr.workers.dev
        run: python run.py

  workflow-keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1
